<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S2AI 学习树</title>
<style>
  :root {
    font-family: var(--kimi-font-sans, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
    --kt: var(--kimi-color-text-primary, #1a1a1a);
    --k2: var(--kimi-color-text-secondary, #555);
    --k3: var(--kimi-color-text-tertiary, #888);
    --k4: var(--kimi-color-text-quaternary, #aaa);
    --bd: var(--kimi-color-border, #e5e5e5);
    --sm: var(--kimi-color-surface-muted, #f5f5f5);
    --pos: var(--kimi-color-positive, #16a34a);
    --warn: var(--kimi-color-warning, #d97706);
    --dan: var(--kimi-color-danger, #dc2626);
    --c1: var(--kimi-chart-1, #2563eb);
    --c3: var(--kimi-chart-3, #16a34a);
    --c4: var(--kimi-chart-4, #9333ea);
    --sans: var(--kimi-font-sans, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
    --mono: var(--kimi-font-mono, ui-monospace, Consolas, monospace);
    --sp1: var(--kimi-space-1, 4px); --sp2: var(--kimi-space-2, 8px); --sp3: var(--kimi-space-3, 12px);
    --sp4: var(--kimi-space-4, 16px); --sp5: var(--kimi-space-5, 20px); --sp6: var(--kimi-space-6, 24px);
    --rc: var(--kimi-radius-chip, 6px); --rp: var(--kimi-radius-panel, 12px); --ri: var(--kimi-radius-input, 10px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, input { font: inherit; color: inherit; }
  .root {
    padding-block-start: var(--sp4);
    padding-inline: var(--sp4);
    padding-block-end: var(--sp4);
    font-family: var(--sans);
    color: var(--kt);
    font-size: 14px;
    line-height: 1.55;
  }
  .head { margin-block-end: var(--sp3); }
  .head h1 { font-size: 17px; font-weight: 500; }
  .head .meta { font-size: 12px; color: var(--k3); margin-block-start: 2px; }
  .stats { display: flex; flex-wrap: wrap; gap: var(--sp1); margin-block-end: var(--sp3); }
  .stat {
    font-size: 12px; color: var(--k3);
    border: 1px solid var(--bd); border-radius: var(--rc);
    padding: 1px var(--sp2);
    font-variant-numeric: tabular-nums;
  }
  .stat b { color: var(--kt); font-weight: 500; margin-inline-end: 3px; }
  .toolbar { margin-block-end: var(--sp3); }
  .toolbar input {
    width: 100%; padding: 7px var(--sp3);
    border: 1px solid var(--bd); border-radius: var(--ri);
    background: transparent; font-size: 14px; color: var(--kt);
  }
  .toolbar input::placeholder { color: var(--k4); }
  .toolbar input:focus { outline: 2px solid var(--kt); outline-offset: -1px; }
  .tabs { display: flex; gap: var(--sp1); flex-wrap: wrap; margin-block-end: var(--sp3); }
  .tab {
    border: 1px solid var(--bd); background: transparent; border-radius: var(--rc);
    padding: 3px var(--sp3); font-size: 13px; color: var(--k2); cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .tab:hover { color: var(--kt); }
  .tab[aria-selected="true"] { background: var(--kt); border-color: var(--kt); color: var(--sm); }
  .tab .cnt { opacity: .65; margin-inline-start: 4px; font-size: 12px; }

  details.ch { border-block-start: 1px solid var(--bd); }
  details.ch:first-of-type { border-block-start: none; }
  details.ch summary {
    display: flex; align-items: center; gap: var(--sp2);
    padding-block: var(--sp2); cursor: pointer; list-style: none;
    font-size: 14px; font-weight: 500;
  }
  details.ch summary::-webkit-details-marker { display: none; }
  details.ch summary .chev {
    flex: none; width: 16px; height: 16px; color: var(--k3);
    transition: transform .15s ease-out;
  }
  details.ch[open] summary .chev { transform: rotate(90deg); }
  details.ch summary .stars { color: var(--warn); font-size: 12px; letter-spacing: 1px; }
  details.ch summary .sum { font-weight: 400; font-size: 12px; color: var(--k3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  details.ch summary .n { margin-inline-start: auto; font-size: 12px; color: var(--k4); font-variant-numeric: tabular-nums; flex: none; }
  .ch-body { padding-block-end: var(--sp3); }
  .p0 { font-size: 12px; color: var(--k2); background: var(--sm); border-radius: var(--rc); padding: var(--sp2) var(--sp3); margin-block-end: var(--sp2); }
  .mod { margin-block-end: var(--sp2); }
  .mod h4 { font-size: 12px; color: var(--k3); font-weight: 500; margin-block-end: 2px; }
  .pt { display: flex; align-items: baseline; gap: var(--sp2); padding-block: 3px; padding-inline: var(--sp1); border-radius: var(--rc); }
  .pt:hover { background: var(--sm); }
  .pt .id { font-family: var(--mono); font-size: 11px; color: var(--k4); flex: none; }
  .pt .nm { flex: 1; min-width: 0; }
  .pt .done { color: var(--pos); font-size: 12px; flex: none; }

  .grp { margin-block-end: var(--sp4); }
  .grp h3 { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: var(--sp2); flex-wrap: wrap; }
  .grp h3 .gmeta { font-weight: 400; font-size: 12px; color: var(--k4); font-variant-numeric: tabular-nums; }
  .grp .gnote { font-size: 12px; color: var(--k3); margin-block: var(--sp1) var(--sp2); }
  .leaf { display: flex; gap: var(--sp2); align-items: baseline; padding-block: 4px; padding-inline: var(--sp1); border-radius: var(--rc); }
  .leaf:hover { background: var(--sm); }
  .leaf .nm { font-weight: 500; }
  .leaf .intro { color: var(--k3); font-size: 12px; }
  .orphan { margin-block-start: var(--sp2); padding-block-start: var(--sp2); border-block-start: 1px dashed var(--bd); font-size: 12px; color: var(--k3); display: flex; flex-wrap: wrap; gap: var(--sp1); align-items: baseline; }

  .cardx { border: 1px solid var(--bd); border-radius: var(--ri); padding: var(--sp3); margin-block-end: var(--sp2); }
  .cardx h3 { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: var(--sp2); flex-wrap: wrap; }
  .cardx .sub { font-size: 12px; color: var(--k3); margin-block-start: 2px; }
  .kv { display: flex; gap: var(--sp2); margin-block-start: var(--sp1); font-size: 13px; }
  .kv b { flex: none; width: 60px; font-weight: 500; font-size: 12px; color: var(--k3); padding-block-start: 1px; }
  .tags { display: flex; flex-wrap: wrap; gap: var(--sp1); }

  a { color: var(--kt); text-decoration: none; border-block-end: 1px solid transparent; }
  a:hover { border-block-end-color: var(--kt); }
  .badge {
    display: inline-block; font-size: 11px; padding: 0 var(--sp2);
    border-radius: var(--rc); border: 1px solid var(--bd); color: var(--k3);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .badge.node { cursor: pointer; color: var(--k2); }
  .badge.node:hover { color: var(--kt); border-color: var(--kt); }
  .badge.broken { color: var(--dan); border-color: color-mix(in srgb, var(--dan) 40%, transparent); text-decoration: line-through; }
  .badge.leafy { color: var(--pos); border-color: color-mix(in srgb, var(--pos) 35%, transparent); background: color-mix(in srgb, var(--pos) 8%, transparent); }
  .badge.lv-深入 { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
  .badge.lv-跟练 { color: var(--pos); border-color: color-mix(in srgb, var(--pos) 35%, transparent); background: color-mix(in srgb, var(--pos) 8%, transparent); }
  .badge.grad { color: var(--c4); border-color: color-mix(in srgb, var(--c4) 35%, transparent); background: color-mix(in srgb, var(--c4) 8%, transparent); }
  .badge.kind-twig { color: var(--c4); border-color: color-mix(in srgb, var(--c4) 35%, transparent); background: color-mix(in srgb, var(--c4) 8%, transparent); }
  .mono { font-family: var(--mono); font-size: 11px; }
  .empty { color: var(--k4); text-align: center; padding-block: var(--sp6); font-size: 13px; }
  .hl { outline: 2px solid var(--warn); outline-offset: 1px; border-radius: var(--rc); }
  footer { margin-block-start: var(--sp4); font-size: 11px; color: var(--k4); }
</style>
</head>
<body>
<div class="root">
  <div class="head">
    <h1>S2AI 学习树</h1>
    <p class="meta" id="meta"></p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="toolbar"><input id="q" type="search" placeholder="搜索当前板块：名称 / 编号 / 关键词…" aria-label="搜索"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"></main>
  <footer>S2AI（science to AI）· 由 scripts/export-dashboard.py 生成 · 数据更新后重新导出即可刷新</footer>
</div>
<script id="tree-data" type="application/json">__DATA__</script>
<script>
const T = JSON.parse(document.getElementById('tree-data').textContent);
const $ = s => document.querySelector(s);

// ---------- 节点索引：id/url -> 位置 ----------
const idx = {};
function reg(key, type, c, m, p) { if (key) idx[key] = { type, c, m, p }; }
T.chapters.forEach((ch, c) => ch.modules.forEach((mo, m) => mo.points.forEach((pt, p) => {
  reg(ch.id + '-' + pt.id, 'theory', c, m, p);
  reg(pt.id, 'theory', c, m, p); // 章内简写
})));
// 叶子分组：树根 → 各篇章（理论地图顺序）→ 野生
const chaptersById = {}; T.chapters.forEach(ch => chaptersById[ch.id] = ch.name);
const LEAF_GROUPS = [];
(function () {
  const byKey = {};
  T.leaves.forEach(l => {
    const k = l.anchor === 'root' || l.anchor === 'wild' ? l.anchor : l.anchor.split('-')[0];
    (byKey[k] = byKey[k] || []).push(l);
  });
  const names = { root: '树根 · 基础工具', wild: '野生叶子' };
  ['root', ...T.chapters.map(c => c.id), 'wild'].forEach(k => {
    if (byKey[k]) LEAF_GROUPS.push({ key: k, name: names[k] || (k + ' · ' + (chaptersById[k] || '')), opt: k === 'wild', items: byKey[k] });
  });
})();
LEAF_GROUPS.forEach((g, gi) => g.items.forEach((l, i) => reg(l.id, 'list', gi, null, i)));
T.inbox.forEach((it, i) => reg(it.url, 'inbox', i));
T.cards.forEach((cd, i) => reg(cd.id, 'card', i));

// 卡片 ↔ 叶子（同站点口径：卡片 target/next 与叶子 id/anchor/tags 相交即相关）
function cardHits(c, l) {
  const keys = new Set([c.target, ...c.next]);
  return keys.has(l.id) || keys.has(l.anchor) || l.tags.some(t => keys.has(t));
}
const cardsByLeafId = {}, orphanCards = {};
T.leaves.forEach(l => {
  const cs = T.cards.filter(c => cardHits(c, l));
  if (cs.length) cardsByLeafId[l.id] = cs;
});
T.cards.forEach(c => {
  if (!T.leaves.some(l => cardHits(c, l))) {
    const m = c.target.match(/^(\d{2})-M/);
    const ch = m ? m[1] : 'root';
    (orphanCards[ch] = orphanCards[ch] || []).push(c);
  }
});

const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stars = n => '★'.repeat(n) + '<span style="opacity:.25">' + '★'.repeat(Math.max(0, 3 - n)) + '</span>';
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';

let cur = 0, query = '';
const TABS = [
  { key: 'theory', name: '理论地图' },
  { key: 'list', name: '叶子清单' },
  { key: 'inbox', name: '收集箱' },
  { key: 'cards', name: '学习卡片' },
];
const count = { theory: T.chapters.reduce((n, c) => n + c.modules.reduce((k, m) => k + m.points.length, 0), 0),
  list: T.leaves.length, inbox: T.inbox.length, cards: T.cards.length };
// 手风琴展开状态：理论地图篇章 / 叶子清单分组
const openCh = new Set(), openGrp = new Set(['root']);
function nodeBadge(key) {
  if (!key) return '';
  if (idx[key]) return `<span class="badge node" data-go="${esc(key)}" title="跳转到 ${esc(key)}">${esc(key)}</span>`;
  return `<span class="badge broken" title="树上没有此节点——断链">${esc(key)}</span>`;
}
function match(...fields) { const q = query.toLowerCase(); return !q || fields.some(f => (f || '').toLowerCase().includes(q)); }

function renderTabs() {
  $('#tabs').innerHTML = TABS.map((t, i) =>
    `<button class="tab" role="tab" aria-selected="${i === cur}" data-tab="${i}">${t.name}<span class="cnt">${count[t.key]}</span></button>`).join('');
  $('#stats').innerHTML = [
    ['篇章', T.chapters.length], ['学习点', count.theory], ['叶子', count.list],
    ['收集箱', count.inbox], ['卡片', count.cards],
  ].map(([k, v]) => `<span class="stat"><b>${v}</b>${k}</span>`).join('');
  $('#meta').textContent = '生成于 ' + T.generated + ' · 只读投影（生长动作在 Agent 端）';
}

function panelTheory() {
  return T.chapters.map((ch, c) => {
    const chHit = match(ch.name, ch.summary, ch.p0);
    const modsHtml = ch.modules.map((mo, m) => {
      const rows = mo.points.map((pt, p) => ({ pt, p })).filter(({ pt }) =>
        chHit || match(pt.name, pt.id, ch.id + '-' + pt.id)).map(({ pt, p }) => `
        <div class="pt" id="th-${c}-${m}-${p}">
          <span class="id">${ch.id}-${pt.id}</span><span class="nm">${esc(pt.name)}</span>
          <span>${stars(pt.freq)}</span>${pt.done ? '<span class="done">✓</span>' : ''}
        </div>`).join('');
      return rows ? `<div class="mod"><h4>${esc(mo.name)}</h4>${rows}</div>` : '';
    }).join('');
    if (query && !modsHtml) return '';
    const total = ch.modules.reduce((n, mo) => n + mo.points.length, 0);
    const open = query ? true : openCh.has(ch.id);
    return `<details class="ch" data-ch="${ch.id}" ${open ? 'open' : ''}>
      <summary>${chev}<span>${ch.id} · ${esc(ch.name)}</span><span class="stars">${'★'.repeat(ch.weight)}</span>
        <span class="sum">${esc(ch.summary)}</span><span class="n">${total} 点</span></summary>
      <div class="ch-body">
        ${ch.p0 ? `<p class="p0">优先学习配方：${esc(ch.p0)}</p>` : ''}
        ${modsHtml}
      </div>
    </details>`;
  }).join('') || '<div class="empty">没有匹配的学习点</div>';
}

function panelList() {
  return LEAF_GROUPS.map((g, gi) => {
    const items = g.items.filter(it => match(it.name, it.intro, it.id, it.anchor, it.tags.join(' '))).map((it, i) => `
      <div class="leaf" id="li-${gi}-${i}">
        <span style="flex:1;min-width:0">
          <span class="nm">${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)} ↗</a>` : esc(it.name)}</span>
          ${it.practice ? '<span class="badge">练习</span>' : ''}
          ${it.opt ? '<span class="badge">支线</span>' : ''}
          <span class="intro"> — ${esc(it.intro)}</span>
          ${(cardsByLeafId[it.id] || []).map(c => `<span class="badge leafy node" data-go="${esc(c.id)}" title="学习卡片「${esc(c.name)}」，点击跳转">${esc(c.name)}</span>`).join(' ')}
        </span>
        ${it.anchor.includes('-') ? nodeBadge(it.anchor) : ''}
      </div>`).join('');
    if (query && !items) return '';
    const orphans = orphanCards[g.key] || [];
    const orphanLine = orphans.length && !query ? `
      <p class="orphan">本枝干知识卡片（暂未挂到具体叶子）：
        ${orphans.map(c => `<span class="badge leafy node" data-go="${esc(c.id)}">${esc(c.name)}</span>`).join(' ')}</p>` : '';
    const open = query ? true : openGrp.has(g.key);
    return `<details class="ch grp" data-grp="${g.key}" ${open ? 'open' : ''}>
      <summary>${chev}<span>${esc(g.name)}</span>${g.opt ? '<span class="badge">支线</span>' : ''}
        <span class="n">${g.items.length} 片</span></summary>
      <div class="ch-body">
        ${g.key === 'wild' ? '<p class="gnote">已进树但未落户：树还没长出对应枝干，长出后移入正式分组。</p>' : ''}
        ${items}${orphanLine}
      </div>
    </details>`;
  }).join('') || '<div class="empty">没有匹配的叶子</div>';
}

function panelInbox() {
  return T.inbox.filter(it => match(it.name, it.intro, it.cat, it.concept)).map((it, i) => `
    <div class="cardx" id="ib-${i}">
      <h3><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)} ↗</a>
        <span class="badge ${it.kind === 'twig' ? 'kind-twig' : 'leafy'}">${it.kind === 'twig' ? '新枝节' : '新叶子'}</span>
        <span class="badge lv-${esc(it.level)}">${esc(it.level)}</span>
        ${it.graduated ? `<span class="badge grad">已毕业 ${esc(it.graduated)}</span>` : ''}</h3>
      <div class="sub">${esc(it.cat)} · 收录于 ${esc(it.added)}</div>
      <div class="kv"><b>是什么</b><span>${esc(it.intro)}</span></div>
      <div class="kv"><b>为什么收</b><span>${esc(it.why)}</span></div>
      <div class="kv"><b>怎么下潜</b><span>${esc(it.dive)}</span></div>
      ${it.concept ? `<div class="kv"><b>新概念</b><span>${esc(it.concept)}（待入理论线）</span></div>` : ''}
    </div>`).join('') || '<div class="empty">没有匹配的收集箱条目</div>';
}

function panelCards() {
  return T.cards.filter(cd => match(cd.name, cd.tags.join(' '), cd.target)).map((cd, i) => {
    const relLeaves = T.leaves.filter(l => cardHits(cd, l));
    return `
    <div class="cardx" id="cd-${i}">
      <h3><a href="${esc(cd.url)}" target="_blank" rel="noopener">${esc(cd.name)} ↗</a>
        ${cd.date ? `<span class="badge">${esc(cd.date)}</span>` : ''}
        ${cd.madeBy ? `<span class="badge">${esc(cd.madeBy)}</span>` : ''}</h3>
      <div class="sub">挂载点 ${nodeBadge(cd.target)}</div>
      <div class="kv"><b>技术栈</b><span class="tags">${cd.tags.map(t => `<span class="badge">${esc(t)}</span>`).join('')}</span></div>
      ${relLeaves.length ? `<div class="kv"><b>相关叶子</b><span>${relLeaves.map(l => l.url
        ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`
        : `<span class="badge node" data-go="${esc(l.id)}">${esc(l.name)}</span>`).join('　')}</span></div>` : ''}
      <div class="kv"><b>接下来</b><span>${cd.next.map(n => nodeBadge(n)).join(' ') || '—'}</span></div>
    </div>`;
  }).join('') || '<div class="empty">没有匹配的卡片</div>';
}

const panels = { theory: panelTheory, list: panelList, inbox: panelInbox, cards: panelCards };
const panelEl = { theory: 'th', list: 'li', inbox: 'ib', cards: 'cd' };
const TAB_INDEX = { theory: 0, list: 1, inbox: 2, card: 3 };

function render() {
  renderTabs();
  $('#main').innerHTML = panels[TABS[cur].key]();
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { cur = +b.dataset.tab; render(); });
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  // 手风琴状态写回（搜索时强制展开，不记状态）
  document.querySelectorAll('details.ch[data-ch]').forEach(d =>
    d.ontoggle = () => { if (!query) { d.open ? openCh.add(d.dataset.ch) : openCh.delete(d.dataset.ch); } });
  document.querySelectorAll('details.ch[data-grp]').forEach(d =>
    d.ontoggle = () => { if (!query) { d.open ? openGrp.add(d.dataset.grp) : openGrp.delete(d.dataset.grp); } });
  if (location.hash.length > 1) go(decodeURIComponent(location.hash.slice(1)), true);
}

function go(key, fromHash) {
  const t = idx[key];
  if (!t) return;
  if (t.type === 'theory') openCh.add(T.chapters[t.c].id);
  if (t.type === 'list') openGrp.add(LEAF_GROUPS[t.c].key);
  cur = TAB_INDEX[t.type];
  render();
  const el = document.getElementById(`${panelEl[TABS[cur].key]}-${t.c}${t.m == null ? '-' + t.p : '-' + t.m + '-' + t.p}`);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 1600); }
  if (!fromHash) history.replaceState(null, '', '#' + encodeURIComponent(key));
}

$('#q').addEventListener('input', e => { query = e.target.value.trim(); render(); });
render();
</script>
</body>
</html>
