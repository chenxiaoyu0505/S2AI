})();
LEAF_GROUPS.forEach((g, gi) => g.items.forEach((l, i) => reg(l.id, 'list', gi, null, i)));
T.inbox.forEach((it, i) => reg(it.url, 'inbox', i));
T.cards.forEach((cd, i) => reg(cd.id, 'card', i));

// 卡片 ↔ 叶子（同站点口径：卡片 target/next 与叶子 id/anchor/tags 相交即相关）
function cardHits(c, l) {
  const keys = new Set([c.target, ...c.next]);
  return keys.has(l.id) || keys.has(l.anchor) || l.tags.some(t => keys.has(t));
}
const cardsByLeafId = {}, orphanCards = {};
T.leaves.forEach(l => {
  const cs = T.cards.filter(c => cardHits(c, l));
  if (cs.length) cardsByLeafId[l.id] = cs;
});
T.cards.forEach(c => {
  if (!T.leaves.some(l => cardHits(c, l))) {
    const m = c.target.match(/^(\d{2})-M/);
    const ch = m ? m[1] : 'root';
    (orphanCards[ch] = orphanCards[ch] || []).push(c);
  }
});

// 理论点 ← 叶子/卡片（反向引用，与网页版 TheoryMap 同口径）：叶子的 anchor 或 tags 指向点编号
// 即挂在本枝节；卡片的 target/next 指向点编号即计入
const PT_RE = /^\d{2}-M\d+\.\d+$/;
const leavesByPoint = {}, cardIdsByPoint = {};
T.leaves.forEach(l => {
  const pts = new Set();
  if (PT_RE.test(l.anchor)) pts.add(l.anchor);
  l.tags.forEach(t => { if (PT_RE.test(t)) pts.add(t); });
  pts.forEach(pid => { (leavesByPoint[pid] = leavesByPoint[pid] || []).push(l); });
});
T.cards.forEach(c => {
  const seen = new Set();
  [c.target, ...c.next].forEach(r => {
    if (PT_RE.test(r) && !seen.has(r)) {
      seen.add(r);
      (cardIdsByPoint[r] = cardIdsByPoint[r] || []).push(c.id);
    }
  });
});

const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stars = n => '★'.repeat(n) + '<span style="opacity:.25">' + '★'.repeat(Math.max(0, 3 - n)) + '</span>';
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';

let cur = 0, query = '';
const TABS = [
  { key: 'theory', name: '理论地图' },
  { key: 'list', name: '叶子清单' },
  { key: 'inbox', name: '收集箱' },
  { key: 'cards', name: '学习卡片' },
];
const count = { theory: T.chapters.reduce((n, c) => n + c.modules.reduce((k, m) => k + m.points.length, 0), 0),
  list: T.leaves.length, inbox: T.inbox.length, cards: T.cards.length };
// 手风琴展开状态：理论地图篇章 / 叶子清单分组
const openCh = new Set(), openGrp = new Set(['root']);
function nodeBadge(key) {
  if (!key) return '';
  if (idx[key]) return `<span class="badge node" data-go="${esc(key)}" title="跳转到 ${esc(key)}">${esc(key)}</span>`;
  return `<span class="badge broken" title="树上没有此节点——断链">${esc(key)}</span>`;
}
function match(...fields) { const q = query.toLowerCase(); return !q || fields.some(f => (f || '').toLowerCase().includes(q)); }

function renderTabs() {
  $('#tabs').innerHTML = TABS.map((t, i) =>
    `<button class="tab" role="tab" aria-selected="${i === cur}" data-tab="${i}">${t.name}<span class="cnt">${count[t.key]}</span></button>`).join('');
  $('#stats').innerHTML = [
    ['篇章', T.chapters.length], ['学习点', count.theory], ['叶子', count.list],
    ['收集箱', count.inbox], ['卡片', count.cards],
  ].map(([k, v]) => `<span class="stat"><b>${v}</b>${k}</span>`).join('');
  $('#meta').textContent = '生成于 ' + T.generated + ' · 只读投影（生长动作在 Agent 端）';
}

function panelTheory() {
  return T.chapters.map((ch, c) => {
    const chHit = match(ch.name, ch.summary, ch.p0);
    const modsHtml = ch.modules.map((mo, m) => {
      const rows = mo.points.map((pt, p) => ({ pt, p })).filter(({ pt }) =>
        chHit || match(pt.name, pt.id, ch.id + '-' + pt.id)).map(({ pt, p }) => {
        const key = ch.id + '-' + pt.id;
        const here = leavesByPoint[key] || [];
        const chips = here.length ? `<span class="chips">${here.map(l => l.url
          ? `<span class="badge leafy node" data-go="${esc(l.id)}" title="叶子：${esc(l.intro)}，点击在叶子清单定位">${esc(l.name)} ↗</span>`
          : `<span class="badge dash" title="练习项：${esc(l.intro)}">✎ ${esc(l.name)}</span>`).join('')}</span>` : '';
        const leafCnt = here.length ? `<span class="cnt leafy" data-go="${esc(here[0].id)}" title="${here.length} 片叶子长在本枝节，点击在叶子清单定位">叶 ${here.length}</span>` : '';
        const cardIds = cardIdsByPoint[key] || [];
        const cardCnt = cardIds.length ? `<span class="cnt cardy" data-go="${esc(cardIds[0])}" title="${cardIds.length} 张学习卡片指向本点，点击跳去学习卡片">卡 ${cardIds.length}</span>` : '';
        return `
        <div class="pt" id="th-${c}-${m}-${p}">
          <span class="id">${ch.id}-${pt.id}</span><span class="nm">${esc(pt.name)}${chips}</span>
          <span>${stars(pt.freq)}</span>${leafCnt}${cardCnt}${pt.done ? '<span class="done">✓</span>' : ''}
        </div>`;
      }).join('');
      return rows ? `<div class="mod"><h4>${esc(mo.name)}</h4>${rows}</div>` : '';
    }).join('');
    if (query && !modsHtml) return '';
    const total = ch.modules.reduce((n, mo) => n + mo.points.length, 0);
    const open = query ? true : openCh.has(ch.id);
    return `<details class="ch" data-ch="${ch.id}" ${open ? 'open' : ''}>
      <summary>${chev}<span>${ch.id} · ${esc(ch.name)}</span><span class="stars">${'★'.repeat(ch.weight)}</span>
        <span class="sum">${esc(ch.summary)}</span><span class="n">${total} 点</span></summary>
      <div class="ch-body">
        ${ch.p0 ? `<p class="p0">优先学习配方：${esc(ch.p0)}</p>` : ''}
        ${modsHtml}
      </div>
    </details>`;
  }).join('') || '<div class="empty">没有匹配的学习点</div>';
}

function panelList() {
  return LEAF_GROUPS.map((g, gi) => {
    const items = g.items.filter(it => match(it.name, it.intro, it.id, it.anchor, it.tags.join(' '))).map((it, i) => `
      <div class="leaf" id="li-${gi}-${i}">
        <span style="flex:1;min-width:0">
          <span class="nm">${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)} ↗</a>` : esc(it.name)}</span>
          ${it.practice ? '<span class="badge">练习</span>' : ''}
          ${it.opt ? '<span class="badge">支线</span>' : ''}
          <span class="intro"> — ${esc(it.intro)}</span>
          ${(cardsByLeafId[it.id] || []).map(c => `<span class="badge leafy node" data-go="${esc(c.id)}" title="学习卡片「${esc(c.name)}」，点击跳转">${esc(c.name)}</span>`).join(' ')}
        </span>
        ${it.anchor.includes('-') ? nodeBadge(it.anchor) : ''}
      </div>`).join('');
    if (query && !items) return '';
    const orphans = orphanCards[g.key] || [];
    const orphanLine = orphans.length && !query ? `
      <p class="orphan">本枝干知识卡片（暂未挂到具体叶子）：
        ${orphans.map(c => `<span class="badge leafy node" data-go="${esc(c.id)}">${esc(c.name)}</span>`).join(' ')}</p>` : '';
    const open = query ? true : openGrp.has(g.key);
    return `<details class="ch grp" data-grp="${g.key}" ${open ? 'open' : ''}>
      <summary>${chev}<span>${esc(g.name)}</span>${g.opt ? '<span class="badge">支线</span>' : ''}
        <span class="n">${g.items.length} 片</span></summary>
      <div class="ch-body">
        ${g.key === 'wild' ? '<p class="gnote">已进树但未落户：树还没长出对应枝干，长出后移入正式分组。</p>' : ''}
        ${items}${orphanLine}
      </div>
    </details>`;
  }).join('') || '<div class="empty">没有匹配的叶子</div>';
}

function panelInbox() {
  return T.inbox.filter(it => match(it.name, it.intro, it.cat, it.concept)).map((it, i) => `
    <div class="cardx" id="ib-${i}">
      <h3><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)} ↗</a>
        <span class="badge ${it.kind === 'twig' ? 'kind-twig' : 'leafy'}">${it.kind === 'twig' ? '新枝节' : '新叶子'}</span>
        <span class="badge lv-${esc(it.level)}">${esc(it.level)}</span>
        ${it.graduated ? `<span class="badge grad">已毕业 ${esc(it.graduated)}</span>` : ''}</h3>
      <div class="sub">${esc(it.cat)} · 收录于 ${esc(it.added)}</div>
      <div class="kv"><b>是什么</b><span>${esc(it.intro)}</span></div>
      <div class="kv"><b>为什么收</b><span>${esc(it.why)}</span></div>
      <div class="kv"><b>怎么下潜</b><span>${esc(it.dive)}</span></div>
      ${it.concept ? `<div class="kv"><b>新概念</b><span>${esc(it.concept)}（待入理论线）</span></div>` : ''}
    </div>`).join('') || '<div class="empty">没有匹配的收集箱条目</div>';
}

function panelCards() {
  return T.cards.filter(cd => match(cd.name, cd.tags.join(' '), cd.target)).map((cd, i) => {
    const relLeaves = T.leaves.filter(l => cardHits(cd, l));
    return `
    <div class="cardx" id="cd-${i}">
      <h3><a href="${esc(cd.url)}" target="_blank" rel="noopener">${esc(cd.name)} ↗</a>
        ${cd.date ? `<span class="badge">${esc(cd.date)}</span>` : ''}
        ${cd.madeBy ? `<span class="badge">${esc(cd.madeBy)}</span>` : ''}</h3>
      <div class="sub">挂载点 ${nodeBadge(cd.target)}</div>
      <div class="kv"><b>技术栈</b><span class="tags">${cd.tags.map(t => `<span class="badge">${esc(t)}</span>`).join('')}</span></div>
      ${relLeaves.length ? `<div class="kv"><b>相关叶子</b><span>${relLeaves.map(l => l.url
        ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`
        : `<span class="badge node" data-go="${esc(l.id)}">${esc(l.name)}</span>`).join('　')}</span></div>` : ''}
      <div class="kv"><b>接下来</b><span>${cd.next.map(n => nodeBadge(n)).join(' ') || '—'}</span></div>
    </div>`;
  }).join('') || '<div class="empty">没有匹配的卡片</div>';
}

const panels = { theory: panelTheory, list: panelList, inbox: panelInbox, cards: panelCards };
const panelEl = { theory: 'th', list: 'li', inbox: 'ib', cards: 'cd' };
const TAB_INDEX = { theory: 0, list: 1, inbox: 2, card: 3 };

function render() {
  renderTabs();
  $('#main').innerHTML = panels[TABS[cur].key]();
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { cur = +b.dataset.tab; render(); });
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  // 手风琴状态写回（搜索时强制展开，不记状态）
  document.querySelectorAll('details.ch[data-ch]').forEach(d =>
    d.ontoggle = () => { if (!query) { d.open ? openCh.add(d.dataset.ch) : openCh.delete(d.dataset.ch); } });
  document.querySelectorAll('details.ch[data-grp]').forEach(d =>
    d.ontoggle = () => { if (!query) { d.open ? openGrp.add(d.dataset.grp) : openGrp.delete(d.dataset.grp); } });
  if (location.hash.length > 1) go(decodeURIComponent(location.hash.slice(1)), true);
}

function go(key, fromHash) {
  const t = idx[key];
  if (!t) return;
  if (t.type === 'theory') openCh.add(T.chapters[t.c].id);
  if (t.type === 'list') openGrp.add(LEAF_GROUPS[t.c].key);
  cur = TAB_INDEX[t.type];
  render();
  const el = document.getElementById(`${panelEl[TABS[cur].key]}-${t.c}${t.m == null ? '-' + t.p : '-' + t.m + '-' + t.p}`);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 1600); }
  if (!fromHash) history.replaceState(null, '', '#' + encodeURIComponent(key));
}

$('#q').addEventListener('input', e => { query = e.target.value.trim(); render(); });
render();
</script>
</body>
</html>
